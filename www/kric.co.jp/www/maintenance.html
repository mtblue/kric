<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>システムメンテナンス中 | KRIC 関西不動産情報センター</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #1B3664;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  hr {
    border: none;
    border-top: 1px solid #1B3664;
    margin: 0;
  }

  .title-block {
    padding: 40px 0;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: bold;
    line-height: 1.6;
    color: #1B3664;
    letter-spacing: 0.05em;
  }

  /* SP改行：480px以下でのみ表示 */
  .sp-br { display: none; }

  .body-block {
    padding: 40px 0;
  }

  .body-block p {
    font-size: 0.9375rem;
    line-height: 1.9;
    color: #1B3664;
    letter-spacing: 0.03em;
  }

  /* フッターロゴブロック（footer.php の .logo-text .logo-text--footer に準拠） */
  .footer-block {
    padding: 40px 0 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .footer-block img {
    height: 56px;
    width: auto;
    max-height: 56px;
    object-fit: contain;
    display: block;
  }

  /* .logo-ja .logo-ja--footer に準拠 */
  .logo-ja {
    font-family: "Yu Mincho", "游明朝", YuMincho, serif;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    color: #555;
  }

  @media (max-width: 1035px) {
    .footer-block img {
      height: 40px;
      max-height: 40px;
    }
    .logo-ja {
      font-size: 0.9rem;
    }
  }

  @media (max-width: 480px) {
    .sp-br { display: inline; }

    h1 {
      font-size: 1.25rem;
    }

    .title-block {
      padding: 32px 0;
    }

    .body-block {
      padding: 32px 0;
    }

    .body-block p {
      font-size: 0.875rem;
    }

    .logo-ja {
      font-size: 0.75rem;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title-block">
      <h1>ただいま<br class="sp-br">システムメンテナンス中です</h1>
    </div>
    <hr>
    <div class="body-block">
      <p>現在WEBサイトリニューアルに伴う<br class="sp-br">システムメンテナンスを実施中です。</p>
      <p>ご不便をおかけしますが、<br class="sp-br">もうしばらくお待ちください。</p>
    </div>
    <hr>
    <div class="footer-block">
      <img src="/wp-content/themes/default/images/ft_logo.png" alt="KRIC">
      <span class="logo-ja logo-ja--footer">関西不動産情報センター</span>
    </div>
  </div>
</body>
</html>
