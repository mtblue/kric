  <script>
  function clearLibFile(n) {
    var inp = document.getElementById('libFile' + n);
    if (inp) inp.value = '';
    var wrap = document.getElementById('libNewPreview' + n);
    if (wrap) wrap.style.display = 'none';
    var img = document.getElementById('libImgPv' + n);
    if (img) img.style.display = 'none';
    var pdf = document.getElementById('libPdfPv' + n);
    if (pdf) pdf.style.display = 'none';
  }
  function libAttachIconFile(ext) {
    if (['xls','xlsx'].indexOf(ext) >= 0) return 'icon_excel.png';
    if (['doc','docx'].indexOf(ext) >= 0) return 'icon_word.png';
    return 'icon_pdf.png';
  }
  (function () {
    for (var n = 1; n <= 3; n++) {
      (function (i) {
        var inp = document.getElementById('libFile' + i);
        if (!inp) return;
        inp.addEventListener('change', function () {
          var file = this.files[0];
          var wrap = document.getElementById('libNewPreview' + i);
          var imgPv = document.getElementById('libImgPv' + i);
          var pdfPv = document.getElementById('libPdfPv' + i);
          var pdfIcon = document.getElementById('libPdfIcon' + i);
          var pdfName = document.getElementById('libPdfName' + i);
          var fileName = document.getElementById('libFileName' + i);
          if (imgPv) imgPv.style.display = 'none';
          if (pdfPv) pdfPv.style.display = 'none';
          if (!file) { if (wrap) wrap.style.display = 'none'; return; }
          var name = file.name;
          var ext = name.split('.').pop().toLowerCase();
          if (wrap) wrap.style.display = '';
          if (['jpg','jpeg','png','gif'].indexOf(ext) >= 0) {
            if (fileName) { fileName.textContent = name; fileName.style.display = ''; }
            var reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById('libPvImg' + i).src = e.target.result;
              imgPv.style.display = '';
            };
            reader.readAsDataURL(file);
          } else {
            if (fileName) fileName.style.display = 'none';
            if (pdfName) pdfName.textContent = name;
            if (pdfIcon) pdfIcon.src = '/wp-content/themes/default/images/' + libAttachIconFile(ext);
            if (pdfPv) pdfPv.style.display = '';
          }
        });
      })(n);
    }

    // 親カテゴリ変更で子カテゴリを動的取得
    var openerSel = document.getElementById('opener_id');
    if (openerSel) {
      openerSel.addEventListener('change', function () {
        var id = this.value;
        var catSel = document.getElementById('category_id');
        if (!catSel) return;
        fetch('/<?php echo APP_NAME; ?>/library_edit/cmd=get_child/id=' + id)
          .then(function (r) { return r.text(); })
          .then(function (html) {
            catSel.innerHTML = '<option value=""></option>' + html;
          });
      });
    }
  })();
  </script>
