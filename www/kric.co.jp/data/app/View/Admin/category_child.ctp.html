  <script>
  function category_edit(id, na) {
    document.getElementById('catCmd').value = 'category_edit';
    document.getElementById('catId').value = id;
    document.getElementById('catName').value = na;
    document.getElementById('catBtn').textContent = '編集';
    document.getElementById('catName').focus();
  }
  function delete_chk(id) {
    var cid = document.getElementById('catCid').value;
    if (confirm('削除してもよろしいですか？')) {
      location.href = '/<?php echo APP_NAME; ?>/category_child/cmd=delete/id=' + id + '/cid=' + cid;
    }
    return false;
  }
