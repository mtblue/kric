  <script>
  (function () {
    var fileInput = document.getElementById('infoFileInput');
    if (!fileInput) return;
    var fileBtn = document.getElementById('infoFileBtn');
    if (fileBtn) fileBtn.addEventListener('click', function () { fileInput.click(); });
    var wrap = document.getElementById('infoNewFilePreview');
    var imgPreview = document.getElementById('infoImgPreview');
    var previewImg = document.getElementById('infoPreviewImg');
    var pdfPreview = document.getElementById('infoPdfPreview');
    var pdfIcon = document.getElementById('infoPdfIcon');
    var pdfName = document.getElementById('infoPdfName');
    function attachIconFile(ext) {
      if (['xls','xlsx'].indexOf(ext) >= 0) return 'icon_excel.png';
      if (['doc','docx'].indexOf(ext) >= 0) return 'icon_word.png';
      return 'icon_pdf.png';
    }
    var fileName = document.getElementById('infoFileName');
    var clearBtn = document.getElementById('infoFileClear');
    var tmpClearBtn = document.getElementById('tmpFileClear');
    if (tmpClearBtn) {
      tmpClearBtn.addEventListener('click', function () {
        var tmpWrap = document.getElementById('tmpFileWrap');
        if (tmpWrap) tmpWrap.remove();
      });
    }
    var existClearBtn = document.getElementById('existFileClear');
    var existDeleteFlag = document.getElementById('existFileDeleteFlag');
    if (existClearBtn) {
      existClearBtn.addEventListener('click', function () {
        if (existDeleteFlag) existDeleteFlag.value = 'checked';
        var parent = existClearBtn.closest('.reg-input--photo');
        if (parent) {
          parent.querySelectorAll('.reg-map-preview, .bd-reg-pdf-row, .reg-file-info').forEach(function (el) { el.style.display = 'none'; });
        }
      });
    }
    var existWrap = document.getElementById('existFileWrap');
    function clearFile() {
      fileInput.value = '';
      if (wrap) wrap.style.display = 'none';
      if (imgPreview) imgPreview.style.display = 'none';
      if (pdfPreview) pdfPreview.style.display = 'none';
    }
    fileInput.addEventListener('change', function () {
      var file = this.files[0];
      if (imgPreview) imgPreview.style.display = 'none';
      if (pdfPreview) pdfPreview.style.display = 'none';
      if (!file) { if (wrap) wrap.style.display = 'none'; return; }
      if (existWrap) existWrap.style.display = 'none';
      var tmpWrap = document.getElementById('tmpFileWrap');
      if (tmpWrap) tmpWrap.style.display = 'none';
      var name = file.name;
      var ext = name.split('.').pop().toLowerCase();
      if (wrap) wrap.style.display = '';
      if (['jpg','jpeg','png','gif'].indexOf(ext) >= 0) {
        if (fileName) { fileName.textContent = name; fileName.style.display = ''; }
        var reader = new FileReader();
        reader.onload = function (e) { previewImg.src = e.target.result; imgPreview.style.display = ''; };
        reader.readAsDataURL(file);
      } else {
        if (fileName) fileName.style.display = 'none';
        if (pdfName) pdfName.textContent = name;
        if (pdfIcon) pdfIcon.src = '/wp-content/themes/default/images/' + attachIconFile(ext);
        if (pdfPreview) pdfPreview.style.display = '';
      }
    });
    if (clearBtn) clearBtn.addEventListener('click', clearFile);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        if (wrap) wrap.style.display = 'none';
        if (imgPreview) imgPreview.style.display = 'none';
        if (pdfPreview) pdfPreview.style.display = 'none';
        fileInput.value = '';
        var tmpWrap = document.getElementById('tmpFileWrap');
        if (!tmpWrap && existWrap) existWrap.style.display = '';
      }
    });
  })();
  </script>
