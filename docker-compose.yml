version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: docker
    volumes:
      # WordPressが入っているWebルートをマウント
      - ./www/kric.co.jp/www:/var/www/html
      # CakePHPのコアやアプリコードが含まれるdataフォルダをマウント
      - ./www/kric.co.jp/data:/var/www/data
      # wwwフォルダ配下のphp.iniを適用
      - ./www/php.ini:/usr/local/etc/php/php.ini
    networks:
      - kric-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: _kric7
    ports:
      - "3306:3306"
    networks:
      - kric-network

networks:
  kric-network:
    driver: bridge